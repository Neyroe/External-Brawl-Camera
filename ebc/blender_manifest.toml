schema_version = "1.0.0"

id = "external_brawl_camera"
version = "3.0.0"
name = "External Brawl Camera"
tagline = "Drive the Super Smash Bros. Brawl camera from Blender"
maintainer = "Neyroe"
type = "add-on"
website = "https://github.com/Neyroe/External-Brawl-Camera"
tags = ["Camera", "Animation"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

platforms = ["windows-x64", "linux-x64", "macos-x64", "macos-arm64"]

# dolphin-memory-engine 1.3.1 (abi3: works with Blender's Python 3.11 and 3.13).
wheels = [
  "./wheels/dolphin_memory_engine-1.3.1-cp39-abi3-macosx_10_9_x86_64.whl",
  "./wheels/dolphin_memory_engine-1.3.1-cp39-abi3-macosx_11_0_arm64.whl",
  "./wheels/dolphin_memory_engine-1.3.1-cp39-abi3-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/dolphin_memory_engine-1.3.1-cp39-abi3-win_amd64.whl",
]

[permissions]
network = "Optional local Dolphin DevServer (pause, frame step, states)"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.pyc",
]
